# Review behavior
language: pt            # en, ru, es, de, zh, ja, fr, pt
review_mode: detailed     # quick, detailed, comprehensive
temperature: 0.3          # Lower = more focused

# Focus areas
focus:
  security: true
  performance: true
  best_practices: true
  code_style: true
  documentation: false
  testing: true

# Severity levels to report
severity:
  critical: true
  warning: true
  suggestion: true
  nitpick: false

# File filters
ignore:
  - "*.min.js"
  - "*.lock"
  - "package-lock.json"
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/generated/**"

include_only:            # If set, only review these patterns
  - "src/**"
  - "lib/**"

# Limits
max_files: 20            # Max files per review
max_diff_size: 5000      # Max diff lines to analyze
max_file_size: 1000      # Skip files larger than this